<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | شُرَاك</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:8px">
        <a href="index.html" style="font-weight:800;font-size:1.4rem;color:var(--primary)">شُرَاك</a>
      </div>
      <h1>تسجيل الدخول</h1>
      <p class="subtitle">أدخل بريدك وكلمة المرور</p>

      <form id="loginForm">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="loginEmail" required placeholder="name@email.com" dir="ltr" />
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" minlength="6" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">دخول</button>
      </form>

      <div style="margin:18px 0;text-align:center;color:var(--muted);font-size:0.85rem">أو</div>
      <button class="btn btn-outline btn-block" id="googleLoginBtn">دخول بحساب Google</button>

      <p class="auth-switch">ما عندك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
      <p class="auth-switch" style="margin-top:8px"><a href="index.html">العودة للرئيسية</a></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const btn = document.getElementById("loginSubmitBtn");
      btn.disabled = true; btn.textContent = "جاري الدخول...";
      try {
        await loginWithEmail(email, password);
      } catch (err) {
        showToast(err.message || "فشل تسجيل الدخول");
      } finally {
        btn.disabled = false; btn.textContent = "دخول";
      }
    });
    document.getElementById("googleLoginBtn").addEventListener("click", () => loginWithGoogle());
  </script>
</body>
</html>
